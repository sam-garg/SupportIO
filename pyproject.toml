[project]
name = "supportio"
version = "0.1.0"
description = "AI Customer Support Automation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.25.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "langgraph>=1.2.12",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["."]
extraPaths = ["."]

[tool.pylance]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
